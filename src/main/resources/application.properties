spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

spring.threads.virtual.enabled=true

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

#logging.level.org.springframework.data.mongodb.core=DEBUG

app.bean-inspector.enabled=false

app.tvmaze.read-timeout=2s
app.tvmaze.connect-timeout=500ms

#logging.level.org.springframework.security=DEBUG


resilience4j.retry.instances.tvmaze.max-attempts=3
resilience4j.retry.instances.tvmaze.retry-exceptions[0]=com.mx.tvmazemiddleware.exception.TvMazeTimeoutException
resilience4j.retry.instances.tvmaze.retry-exceptions[1]=com.mx.tvmazemiddleware.exception.TvMazeUnavailableException
resilience4j.retry.instances.tvmaze.ignore-exceptions[0]=com.mx.tvmazemiddleware.exception.TvMazeClientErrorException
tvmaze.retry.initial-interval=200ms
tvmaze.retry.multiplier=2.0
tvmaze.retry.jitter=0.5

resilience4j.circuitbreaker.instances.tvmaze.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.tvmaze.sliding-window-size=10
resilience4j.circuitbreaker.instances.tvmaze.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.tvmaze.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tvmaze.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.tvmaze.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.tvmaze.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.tvmaze.slow-call-duration-threshold=1500ms
resilience4j.circuitbreaker.instances.tvmaze.slow-call-rate-threshold=50